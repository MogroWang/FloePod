name: Release Windows
on:
  workflow_run:
    workflows: [Merged PR notification]
    types: [completed]
  workflow_dispatch:
    inputs:
      notification_run_id:
        description: "需要恢复发布的成功合并通知 run ID"
        required: true
        type: string
permissions:
  contents: read
# GitHub queues up to 100 pending runs instead of replacing older releases.
concurrency:
  group: floepod-release
  cancel-in-progress: false
  queue: max
jobs:
  resolve:
    name: Verify merged release source
    if: (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      pr: ${{ steps.identity.outputs.pr }}
      notification: ${{ steps.identity.outputs.notification }}
    steps:
      - name: Load resolver from this workflow's trusted immutable definition
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Verify notification, PR, merge SHA and default-branch ancestry
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-identity.mjs
  publish:
    name: Build, sign, attest and publish merged source
    needs: resolve
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RELEASE_SHA: ${{ needs.resolve.outputs.sha }}
      RELEASE_PR: ${{ needs.resolve.outputs.pr }}
      NOTIFICATION_RUN: ${{ needs.resolve.outputs.notification }}
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Check out the verified immutable merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - name: Verify HEAD, source versions and idempotent release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs --prepare
      - name: Set up pnpm and Node.js
        if: steps.state.outputs.published != 'true'
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
      - name: Set up locked Rust toolchain
        if: steps.state.outputs.published != 'true'
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
      - name: Install locked dependencies
        if: steps.state.outputs.published != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build executable without repeating CI quality gates
        if: steps.state.outputs.published != 'true'
        run: pnpm tauri build --ci --no-bundle --config '{"build":{"beforeBuildCommand":"pnpm exec vite build"}}'
      - name: Prepare certificate for Tauri signing callbacks
        if: steps.state.outputs.published != 'true'
        shell: pwsh
        env:
          SIGN_CERTIFICATE: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
          SIGN_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SIGN_CERTIFICATE) {
            'Authenticode: unsigned (no certificate configured).' >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $certificate = Join-Path $env:RUNNER_TEMP 'floepod-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:SIGN_CERTIFICATE))
          $env:FLOEPOD_SIGN_CERT_PATH = $certificate
          $env:FLOEPOD_SIGN_CERT_PASSWORD = $env:SIGN_PASSWORD
          $cert = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificate, $env:SIGN_PASSWORD)
          try { $publisher = $cert.Subject } finally { $cert.Dispose() }
          if ($publisher -match '[\r\n]') { throw 'Invalid certificate subject' }
          "FLOEPOD_SIGN_CERT_PATH=$certificate" >> $env:GITHUB_ENV
          "FLOEPOD_MSIX_PUBLISHER=$publisher" >> $env:GITHUB_ENV
      - name: Package final executable as NSIS, MSI and MSIX
        if: steps.state.outputs.published != 'true'
        shell: pwsh
        env:
          FLOEPOD_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
        run: ./scripts/bundle-windows.ps1
      - name: Package portable ZIP
        if: steps.state.outputs.published != 'true'
        run: node scripts/package-portable.mjs
      - name: Validate versions, final assets, signatures and checksums
        if: steps.state.outputs.published != 'true'
        run: ./scripts/collect-windows-artifacts.ps1 -Destination dist/release -Commit $env:RELEASE_SHA
      - name: Record actual immutable source provenance
        if: steps.state.outputs.published != 'true'
        run: node scripts/release-provenance.mjs
      - name: Attest final assets
        if: steps.state.outputs.published != 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: dist/release-provenance.json
      - name: Publish and verify GitHub upload digests
        if: steps.state.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-state.mjs --publish
      - name: Remove temporary certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'floepod-signing.pfx'
          if (Test-Path -LiteralPath $certificate) { Remove-Item -LiteralPath $certificate -Force }
