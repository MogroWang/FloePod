name: Merged PR notification
run-name: "Merged PR #${{ github.event.pull_request.number }} at ${{ github.event.pull_request.merge_commit_sha }}"
on:
  pull_request_target:
    types: [closed]
permissions:
  contents: read
# No checkout, dependency execution, artifacts, secrets or write permissions.
jobs:
  merged:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo 'Merge notification recorded; the release independently verifies its identity.'
