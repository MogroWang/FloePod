name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    name: Version consistency and uniqueness
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node scripts/version-gate.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  dependency-audit:
    name: Audit JavaScript and Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false
      - name: Audit locked JavaScript dependencies
        run: pnpm audit --audit-level high --registry https://registry.npmjs.org
      - name: Install pinned Rust audit tool
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies (warnings remain visible)
        run: cargo audit --file src-tauri/Cargo.lock
  build-windows:
    name: Validate and package Windows x64
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: true
          install: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm version:check
      - name: Frontend behavior and release safety regression tests
        run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Native file safety, lifecycle, privacy and migration regressions
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Generated IPC schema and TypeScript bindings must match Rust
        run: pnpm ipc:check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Production Windows build, frontend typecheck, NSIS and MSI
        run: pnpm tauri build --ci
      - run: node scripts/package-portable.mjs
      - run: ./scripts/package-msix.ps1
      - name: Validate packaged versions, embedded binaries and checksums
        run: ./scripts/collect-windows-artifacts.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FloePod-windows-x64-${{ github.run_number }}-${{ github.sha }}
          path: dist/github-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
