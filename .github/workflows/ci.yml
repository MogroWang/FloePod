name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Re-check newly disclosed advisories even when the lockfiles do not change.
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Audit JavaScript and Rust dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          install: false

      - name: Audit JavaScript dependencies
        run: pnpm audit --audit-level high

      - name: Audit Rust dependencies
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri

  build-windows:
    name: Validate and package Windows x64
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Set up Rust
        # rust-toolchain.toml 钉住 1.97.1；这里显式传同一版本，避免额外安装 stable
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Cache Rust dependencies and build outputs
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend contract tests
        run: pnpm test

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Rust lints
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Build Tauri application, NSIS, and MSI installers
        run: pnpm tauri build --ci

      - name: Build portable package
        run: node scripts/package-portable.mjs

      - name: Build unsigned MSIX package
        shell: pwsh
        run: ./scripts/package-msix.ps1

      - name: Collect Windows artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "dist/github-artifacts"
          New-Item -ItemType Directory -Path $artifactDir -Force | Out-Null

          $binary = Get-Item "src-tauri/target/release/FloePod.exe"
          $installers = @(Get-ChildItem "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -File)
          $msiPackages = @(Get-ChildItem "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File)
          $portablePackages = @(Get-ChildItem "dist" -Filter "FloePod-*-win-x64-portable.zip" -File)
          $msixPackages = @(Get-ChildItem "dist" -Filter "FloePod-*-win-x64.msix" -File)

          if ($installers.Count -eq 0) {
            throw "Tauri did not produce an NSIS installer."
          }
          if ($portablePackages.Count -ne 1) {
            throw "Expected exactly one portable package, found $($portablePackages.Count)."
          }
          if ($msiPackages.Count -ne 1) {
            throw "Expected exactly one MSI package, found $($msiPackages.Count)."
          }
          if ($msixPackages.Count -ne 1) {
            throw "Expected exactly one MSIX package, found $($msixPackages.Count)."
          }

          Copy-Item -LiteralPath $binary.FullName -Destination $artifactDir
          $installers | ForEach-Object {
            Copy-Item -LiteralPath $_.FullName -Destination $artifactDir
          }
          Copy-Item -LiteralPath $msiPackages[0].FullName -Destination $artifactDir
          Copy-Item -LiteralPath $portablePackages[0].FullName -Destination $artifactDir
          Copy-Item -LiteralPath $msixPackages[0].FullName -Destination $artifactDir

          $checksums = Get-ChildItem $artifactDir -File |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          $checksums | Set-Content -LiteralPath (Join-Path $artifactDir "SHA256SUMS.txt") -Encoding utf8NoBOM

      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: FloePod-windows-x64-${{ github.run_number }}-${{ github.sha }}
          path: dist/github-artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
